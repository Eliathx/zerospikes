# Measures how far zerospikes can be trusted on a CI runner, with the 20k example:
# false alarms of recorded budgets, and `zerospikes compare` on the same build and
# on slowed builds. Each check runs on its own runner so they don't compete for CPU.
# Too slow for every push: run it by hand, and weekly to catch drift in runners or Chromium.
name: reliability

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: budgets false alarms
            command: npm run perf:reliability -- --only clean
            recordBudgets: true
          - check: compare same build
            command: npm run perf:compare-reliability -- --factors ""
          - check: compare slowed x1.1
            command: npm run perf:compare-reliability -- --same-build 0 --factors 1.1
          - check: compare slowed x1.25
            command: npm run perf:compare-reliability -- --same-build 0 --factors 1.25
          - check: compare slowed x1.5
            command: npm run perf:compare-reliability -- --same-build 0 --factors 1.5
          - check: compare slowed x2
            command: npm run perf:compare-reliability -- --same-build 0 --factors 2
    defaults:
      run:
        working-directory: examples/20k-table
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: npx playwright install --with-deps chromium
      # The committed budgets were recorded on another machine: record this runner's own first.
      - if: matrix.recordBudgets
        run: npm run build && npx playwright test --update-snapshots=all
      - run: ${{ matrix.command }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.check }}
          path: examples/20k-table/zerospikes-results/*.json
          if-no-files-found: ignore
